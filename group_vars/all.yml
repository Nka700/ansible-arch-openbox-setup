
### Playbook Configuration Variables
# You may modify the following variables to customize the playbook to your
# specific needs, however do not remove any variables, they are all required
# for the playbook to function.

## User info
#username: 

## aur info
paru:
  git_url: https://aur.archlinux.org/paru.git
  install_dir: /usr/bin/paru
  build_dir: /home/{{ username }}/yay
  install_shell: makepkg -sf --noconfirm
  pkg_install_shell: paru -S --noconfirm obmenu obmenu-generator nitrogen rcm

yay:
  git_url: https://aur.archlinux.org/yay.git
  install_dir: /usr/bin/yay
  build_dir: /home/{{ username }}/yay
  install_shell: makepkg -sf --noconfirm
  pkg_install_shell: yay -S --noconfirm obmenu obmenu-generator nitrogen rcm

## zplug info
zplug:
  git_url: https://github.com/zplug/zplug
  install_dir: ~/.zplug

## Task Configuration
setup_zsh: True

## Dotfiles
## Please make sure to update 
pull_dotfiles: True

dotfiles:
    url: https://github.com/Nka700/.dotfiles.git
    destination: ~/.dotfiles
    conkyrc1_destination: ~/.dotfiles/config/conky/.conkyrc
    conkyrc2_destination: ~/.dotfiles/config/conky/.conkyrc2
    kitty_destination: ~/.dotfiles/config/kitty/kitty.conf
    openbox_autostart_destination: ~/.dotfiles/config/openbox/autostart
    openbox_environment_destination: ~/.dotfiles/config/openbox/environment
    openbox_rcxml_destination: ~/.dotfiles/config/openbox/rc.xml
    xprofile_destination: ~/.dotfiles/xprofile
    bashrc_destination: ~/.dotfiles/bashrc
    zshrc_destination: ~/.dotfiles/zshrc
    vimrc_destination: ~/.dotfiles/vimrc
    lsytmplylst_destination: ~/.dotfiles/local/bin/lsytmplylst
    mpvy_destination: ~/.dotfiles/local/bin/mpvy
    pulsedroid_server_destination: ~/.dotfiles/local/bin/pulsedroid_server.sh
    rofi_run_destination: ~/.dotfiles/local/bin/rofi_run
    s3_cp_chatgpt_destination: ~/.dotfiles/local/bin/s3_cp_chatgpt-session
    s3_cp_pacman_pkg_caches_destination: ~/.dotfiles/local/bin/s3_cp_pacman_pkg_caches
    speedtest_destination: ~/.dotfiles/local/bin/speedtest-cli
    youtube_transcript_api_destination: ~/.dotfiles/local/bin/youtube_transcript_api
    fcitx5_destination: ~/.dotfiles/config/fcitx5/config
    jgmenu_append_destination: ~/.dotfiles/config/jgmenu/append.csv
    jgmenu_rc_destination: ~/.dotfiles/config/jgmenu/jgmenurc
    jgmenu_prepend_destination: ~/.dotfiles/config/jgmenu/prepend.csv
    picom_destination: ~/.dotfiles/config/picom.conf
    redshift_destination: ~/.dotfiles/config/redshift.conf
    rofi_config_destination: ~/.dotfiles/config/rofi/config.rasi
    terminator_destination: ~/.dotfiles/config/terminator/config
    tint2rc_destination: ~/.dotfiles/config/tint2/tint2rc
    xfce_keyboard_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/keyboards.xml
    xfce_desktop_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    xfce_keyboard_shortcuts_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml
    xfce_panel_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
    xfce_power_manager_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml
    xfce_settings_editor_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/xfce4-settings-editor.xml
    xfce_settings_manager_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/xfce4-settings-manager.xml
    xfwm4_destination: ~/.dotfiles/config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
    #    rcup_flags: -f

## Desktop
install_openbox: True

## App Preferences
## ===========================
# Web Browser
# Value can be: vivaldi, firefox, brave, or chromium
browser: chromium

## When set to True, will install elinks and w3m
install_terminal_browsers: True

## Installs LibreOffice Fresh when True
install_office: True

## Console-based email client
#install_aerc: True

## AUR vars
use_aur: True

## python packages
python:
  packages:
    - pynvim

## Installs python packages
install_pythonpkg: True

## tlp vars
configure_tlp: True
