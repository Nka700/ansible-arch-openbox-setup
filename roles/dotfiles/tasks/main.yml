---
- name: Clone user dotfiles
  git: 
    repo: "{{ dotfiles.url }}"
    dest: "{{ dotfiles.destination }}"
    update: no
  become: yes
  become_user: "{{ username }}"

- name: Create required directories for dotfiles
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ~/.config/conky/
    - ~/.config/tint2/
    - ~/.config/xfce4/xfconf/xfce-perchannel-xml/
    - ~/.config/fcitx/
    - ~/.config/fcitx5/
    - ~/.config/jgmenu/
    - ~/.config/rofi//
    - ~/.local/bin/
  become: yes
  become_user: "{{ username }}"

- name: Link dotfiles and binaries
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "{{ dotfiles.conkyrc1_destination }}", dest: "~/.config/conky/.conkyrc" }
    - { src: "{{ dotfiles.conkyrc2_destination }}", dest: "~/.config/conky/.conkyrc2" }
    - { src: "{{ dotfiles.bashrc_destination }}", dest: "~/.bashrc" }
    - { src: "{{ dotfiles.zshrc_destination }}", dest: "~/.zshrc" }
    - { src: "{{ dotfiles.vimrc_destination }}", dest: "~/.vimrc" }
    - { src: "{{ dotfiles.lsytmplylst_destination }}", dest: "~/.local/bin/lsytmplylst" }
    - { src: "{{ dotfiles.mpvy_destination }}", dest: "~/.local/bin/mpvy" }
    - { src: "{{ dotfiles.pulsedroid_server_destination }}", dest: "~/.local/bin/pulsedroid_server.sh" }
    - { src: "{{ dotfiles.rofi_run_destination }}", dest: "~/.local/bin/rofi_run" }
#    - { src: "{{ dotfiles.s3_cp_chatgpt_destination }}", dest: "~/.local/bin/s3_cp_chatgpt-session" }
#    - { src: "{{ dotfiles.s3_cp_pacman_pkg_caches_destination }}", dest: "~/.local/bin/s3_cp_var_cache_pacman_pkg" }
    - { src: "{{ dotfiles.speedtest_destination }}", dest: "~/.local/bin/speedtest-cli" }
    - { src: "{{ dotfiles.youtube_transcript_api_destination }}", dest: "~/.local/bin/youtube_transcript_api" }
    - { src: "{{ dotfiles.fcitx5_destination }}", dest: "~/.config/fcitx5/config" }
    - { src: "{{ dotfiles.jgmenu_append_destination }}", dest: "~/.config/jgmenu/append.csv" }
    - { src: "{{ dotfiles.jgmenu_rc_destination }}", dest: "~/.config/jgmenu/jgmenurc" }
    - { src: "{{ dotfiles.jgmenu_prepend_destination }}", dest: "~/.config/jgmenu/prepend.csv" }
    - { src: "{{ dotfiles.picom_destination }}", dest: "~/.config/picom.conf" }
    - { src: "{{ dotfiles.redshift_destination }}", dest: "~/.config/redshift.conf" }
    - { src: "{{ dotfiles.rofi_config_destination }}", dest: "~/.config/rofi/config.rasi" }
    - { src: "{{ dotfiles.tint2rc_destination }}", dest: "~/.config/tint2/tint2rc" }
    - { src: "{{ dotfiles.xfce_keyboard_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/keyboards.xml" }
    - { src: "{{ dotfiles.xfce_desktop_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml" }
    - { src: "{{ dotfiles.xfce_keyboard_shortcuts_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml" }
    - { src: "{{ dotfiles.xfce_panel_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml" }
    - { src: "{{ dotfiles.xfce_power_manager_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml" }
    - { src: "{{ dotfiles.xfce_settings_editor_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-settings-editor.xml" }
    - { src: "{{ dotfiles.xfce_settings_manager_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-settings-manager.xml" }
    - { src: "{{ dotfiles.xfwm4_destination }}", dest: "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml" }
  become: yes
  become_user: "{{ username }}"
