---
- name: Distribute SSH public key to target server
  become: yes
  become_user: "{{ username }}"

  tasks:
    - name: Ensure the ~/.ssh directory exists
      file:
        path: ~/.ssh/
        state: directory
        mode: '0700'

    - name: Add the public key to authorized_keys
      authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

