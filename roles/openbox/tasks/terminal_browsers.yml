- name: install term browsers
  community.general.pacman:
   name:
    - terminator
    - kitty
    - xfce4-terminal
   state: present

- name: Create required directories for term dotfiles
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  become: yes
  become_user: "{{ username }}"
  loop:
    - ~/.config/kitty/
    - ~/.config/terminator/

- name: link term dotfiles 
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  become: yes
  become_user: "{{ username }}"
  loop:
    - { src: "{{ dotfiles.kitty_destination }", dest: "~/.config/kitty/kitty.conf" }
    - { src: "{{ dotfiles.terminator_destination }", dest: "~/.config/terminator/config" }

